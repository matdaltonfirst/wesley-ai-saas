<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subscribed — Wesley AI</title>
  {% include 'partials/head.html' %}
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    html { height: auto; overflow: visible; }

    body {
      height: auto;
      overflow-y: auto;
      min-height: 100vh;
      background:
        radial-gradient(900px 520px at 50% -8%, rgba(42,173,181,0.30), transparent 62%),
        linear-gradient(168deg, var(--ink) 0%, var(--ink-deep) 100%);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .success-wrap {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .success-brand { margin-bottom: 28px; }
    .success-logo  { height: 36px; }

    .success-card {
      background: var(--white);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--r-xl);
      padding: 38px 34px 34px;
      box-shadow: 0 40px 80px -32px rgba(4, 12, 24, 0.6);
      animation: cardIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .check-circle {
      width: 58px;
      height: 58px;
      background: var(--teal-tint);
      color: var(--teal-dark);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .check-circle .ico { width: 27px; height: 27px; stroke-width: 2.25; }

    .success-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.03em;
      margin: 0 0 10px;
    }

    .success-sub {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.65;
      margin: 0 0 28px;
    }

    .success-btn {
      display: inline-block;
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: var(--r-pill);
      padding: 13px 30px;
      font-size: 0.9375rem;
      font-weight: 700;
      font-family: var(--font-display);
      cursor: pointer;
      text-decoration: none;
      transition: filter 0.15s, box-shadow 0.15s, transform 0.1s;
    }
    .success-btn:hover {
      filter: brightness(0.88);
      box-shadow: 0 4px 12px rgba(42,173,181,0.25);
    }
    .success-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  {% include 'partials/icons.html' %}

  <div class="success-wrap">

    <div class="success-brand">
      <img src="/static/WesleyAI.png" alt="Wesley AI" class="success-logo" />
    </div>

    <div class="success-card">
      <div class="check-circle"><svg class="ico"><use href="#i-check"></use></svg></div>
      <h1 class="success-title">You're subscribed!</h1>
      <p class="success-sub">
        Welcome to Wesley AI. Your subscription is now active and your church's
        AI assistant is ready to go.
      </p>
      <a href="/" class="success-btn">Start chatting →</a>
    </div>

  </div>

</body>
</html>
